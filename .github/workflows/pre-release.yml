name: Auto pre-release on push

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from manifest.json
        id: version
        run: |
          VERSION=$(jq -r '.version' custom_components/my_suivi_colis/manifest.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if version contains "beta"
        id: is_beta
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if echo "$VERSION" | grep -qi "beta"; then
            echo "is_beta=true" >> $GITHUB_OUTPUT
          else
            echo "is_beta=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag already exists
        id: tag_exists
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create pre-release
        if: steps.is_beta.outputs.is_beta == 'true' && steps.tag_exists.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: |
            Auto-generated pre-release for beta version v${{ steps.version.outputs.version }}.
          prerelease: true
          make_latest: false
